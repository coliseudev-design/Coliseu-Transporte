version: '3.8'

services:
  # Serviço 1: Frontend SPA (React/Vite + Nginx)
  dashboard-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coliseu-transporte-frontend
    restart: unless-stopped
    ports:
      - "80"  # Permitir que Coolify mapie dinamicamente via Traefik
    networks:
      - coolify
    depends_on:
      - middleware

  # Serviço 2: API Node.js Express (Backend)
  middleware:
    build: 
      context: ./middleware
      dockerfile: Dockerfile
    container_name: coliseu-transporte-middleware
    restart: unless-stopped
    networks:
      coolify:
        aliases:
          - coliseu-transporte-middleware
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      # Ambiente do banco: 'demo' habilita seeds de teste (frota). 'production' desabilita.
      - APP_AMBIENTE=${APP_AMBIENTE:-production}
      - PORT=${PORT:-3200}
      
      # Banco de dados
      - PG_HOST=${PG_HOST}
      - PG_PORT=${PG_PORT:-5432}
      - PG_DATABASE=${PG_DATABASE:-nexus_dashboard}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_SSL=${PG_SSL:-false}
      
      # Identity Server / Segurança e Cofre Criptográfico (AES-256-GCM)
      - JWT_DEVICE_KEY=${JWT_DEVICE_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - EXPECTED_MODULE_SLUG=${EXPECTED_MODULE_SLUG:-coliseu-transporte}
      - IDENTITY_API_URL=${IDENTITY_API_URL:-https://adminlicencas.coliseusistemas.com.br}
      - IDENTITY_INTERNAL_KEY=${IDENTITY_INTERNAL_KEY:-}

      # Integração Fiscal Focus NFe v2 (Conta Parceiro / Software House)
      - FOCUS_MASTER_TOKEN=${FOCUS_MASTER_TOKEN:-}
      - FOCUS_WEBHOOK_SECRET=${FOCUS_WEBHOOK_SECRET:-}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-https://transporte.coliseusistemas.com.br}
      
      # Comunicação com o Worker
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      
      # Limits
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-1000}
      - AUTH_RATE_LIMIT_MAX=${AUTH_RATE_LIMIT_MAX:-20}
    
    ports:
      - "3200" # Exposto apenas para a rede interna; Nginx/Traefik cuidam do roteamento externo
      
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:3200/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# db-backup removido pois o Coolify cuida do backup da base central nativamente.

networks:
  coolify:
    external: true
