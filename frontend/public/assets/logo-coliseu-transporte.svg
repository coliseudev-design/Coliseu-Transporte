<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="Coliseu Transporte">
  <defs>
    <linearGradient id="ctGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="ctWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Onda Coliseu (3 faixas) -->
  <g transform="translate(4 10)">
    <path d="M0 8 Q 10 0 20 8 T 40 8 T 60 8" fill="none" stroke="url(#ctWave)" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 22 Q 10 14 20 22 T 40 22 T 60 22" fill="none" stroke="url(#ctWave)" stroke-width="6" stroke-linecap="round" opacity="0.78"/>
    <path d="M0 36 Q 10 28 20 36 T 40 36 T 60 36" fill="none" stroke="url(#ctWave)" stroke-width="6" stroke-linecap="round" opacity="0.52"/>
  </g>

  <!-- Tipografia -->
  <text x="76" y="28" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="800" letter-spacing="-0.4" fill="#0F172A">
    COLISEU
  </text>
  <text x="76" y="50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="800" letter-spacing="-0.4" fill="url(#ctGrad)">
    TRANSPORTE
  </text>

  <!-- Selo fiscal -->
  <g transform="translate(238 12)">
    <rect x="0" y="0" width="76" height="40" rx="9" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.5"/>
    <text x="38" y="17" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8" fill="#0369A1">
      CT-e · MDF-e
    </text>
    <text x="38" y="31" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.3" fill="#075985">
      SEFAZ · CIOT
    </text>
  </g>
</svg>
