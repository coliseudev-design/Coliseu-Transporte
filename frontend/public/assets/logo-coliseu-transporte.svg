<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72" role="img" aria-label="Coliseu Transporte">
  <defs>
    <linearGradient id="ctWave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B63A5"/>
      <stop offset="55%" stop-color="#2B8FD6"/>
      <stop offset="100%" stop-color="#48C7E8"/>
    </linearGradient>
    <linearGradient id="ctWord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B3B66"/>
      <stop offset="100%" stop-color="#0B63A5"/>
    </linearGradient>
  </defs>

  <!-- Marca: onda Coliseu reinterpretada como rotaestrada -->
  <g transform="translate(6 10)">
    <path d="M0 9 Q 9 1 18 9 T 36 9 T 54 9" fill="none" stroke="url(#ctWave)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M0 25 Q 9 17 18 25 T 36 25 T 54 25" fill="none" stroke="url(#ctWave)" stroke-width="6.5" stroke-linecap="round" opacity="0.62"/>
    <path d="M0 41 Q 9 33 18 41 T 36 41 T 54 41" fill="none" stroke="url(#ctWave)" stroke-width="6.5" stroke-linecap="round" opacity="0.3"/>
    <!-- Pino de rota -->
    <circle cx="54" cy="9" r="4.5" fill="#0B63A5"/>
    <circle cx="54" cy="9" r="8" fill="none" stroke="#0B63A5" stroke-width="1.6" opacity="0.35"/>
  </g>

  <!-- Tipografia -->
  <text x="76" y="30" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="21" font-weight="800" letter-spacing="-0.4" fill="#0F172A">COLISEU</text>
  <text x="76" y="52" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="21" font-weight="800" letter-spacing="-0.4" fill="url(#ctWord)">TRANSPORTE</text>

  <!-- Selo fiscal compacto -->
  <g transform="translate(212 44)">
    <rect x="0" y="0" width="80" height="20" rx="6" fill="#E6F0FA" stroke="#B7D4EE" stroke-width="1"/>
    <text x="40" y="14" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
          font-size="8.5" font-weight="800" letter-spacing="0.6" fill="#0B63A5">CT-e · MDF-e</text>
  </g>
</svg>
