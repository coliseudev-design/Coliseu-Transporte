<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-label="Coliseu Transporte">
  <defs>
    <linearGradient id="ctWave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B3B66"/>
      <stop offset="55%" stop-color="#17699E"/>
      <stop offset="100%" stop-color="#2E9AC9"/>
    </linearGradient>
    <linearGradient id="ctWord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B3B66"/>
      <stop offset="100%" stop-color="#17699E"/>
    </linearGradient>
  </defs>

  <!-- Marca: onda Coliseu reinterpretada como estrada com pino de rota -->
  <g transform="translate(4 12)">
    <path d="M0 8 Q 8 1 16 8 T 32 8 T 48 8" fill="none" stroke="url(#ctWave)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M0 22 Q 8 15 16 22 T 32 22 T 48 22" fill="none" stroke="url(#ctWave)" stroke-width="5.5" stroke-linecap="round" opacity="0.58"/>
    <path d="M0 36 Q 8 29 16 36 T 32 36 T 48 36" fill="none" stroke="url(#ctWave)" stroke-width="5.5" stroke-linecap="round" opacity="0.28"/>
    <circle cx="48" cy="8" r="3.6" fill="#0B3B66"/>
    <circle cx="48" cy="8" r="6.5" fill="none" stroke="#0B3B66" stroke-width="1.4" opacity="0.3"/>
  </g>

  <!-- Tipografia -->
  <text x="68" y="28" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="20" font-weight="800" letter-spacing="-0.3" fill="#0F172A">COLISEU</text>
  <text x="68" y="48" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="20" font-weight="800" letter-spacing="-0.3" fill="url(#ctWord)">TRANSPORTE</text>
</svg>
